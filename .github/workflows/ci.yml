name: CI

on:
  push:
    branches: [master, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.3.4
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y librabbitmq-dev
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
      - run: nimble install -y --depsOnly
      - run: nimble test
      - run: nimble buildRelease
      - run: nim c -r --path:src tests/test_rabbitmq.nim

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build . --tag fediwatch:test
