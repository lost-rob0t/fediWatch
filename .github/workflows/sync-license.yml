name: Sync AGPLv3 license

on:
  push:
    branches:
      - agent/modernize-starintel-0.9

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/modernize-starintel-0.9
      - name: Install canonical AGPLv3 text
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/licenses/license-templates/aa0399cd31350a2692d0f51f651fc2fd3d0a5dab/templates/agpl3.txt \
            --output LICENSE
      - name: Commit exact license text
        run: |
          if git diff --quiet -- LICENSE; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LICENSE
          git commit -m "Install canonical AGPLv3 text"
          git push origin HEAD:agent/modernize-starintel-0.9
